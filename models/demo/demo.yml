version: 2

models:
  - name: employee
    description: "Employee DBT model"
    columns:
      - name: emp_id
        data_tests:
          # in built is unique, not null, accepted values
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '3', '4', '5']
                config:
                  severity: warn
      - name: emp_salary
        data_tests:
          # we can also define out own SQL
          - salary_check
  - name: customer
    description: "DBT Model for the customer table"
    columns:
      - name: CUSTOMER_ID
        description: "Primary key — one row per customer."
      - name: EMAIL
        description: "Customer email address."
      - name: COUNTRY
        description: "Customer country (free text from source)."
      - name: INSERT_DTS
        description: "{{ doc('insert_dts') }}"
  - name: customer_vw
    description: "DBT Model for the customer view"
  - name: sales
    description: "DBT model for the sales table"
    columns:
      - name: CUSTOMER_ID
        data_tests:
          - relationships:
              arguments:
                to: ref('customer')
                # refer to customer table - another data model
                field: CUSTOMER_ID
                # looking at CUSTOMER_ID, anything inside sales should have a valid customer
  - name: product
    description: "DBT Model for the product table"
  - name: purchase
    description: "DBT model for the purchase table"
  - name: clean_orders
    description: "DBT ephemeral model for the clean orders"
  - name: final_orders
    description: "DBT model for the final orders"
  - name: session
    description: "DBT Model for the session table"
  - name: concat_name
    description: "DBT Model for the concat name"
  - name: concat_address
    description: "DBT Model for the concat address"

sources:
  - name: employee
    database: PC_DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
  - name: customer
    database: PC_DBT_DB
    schema: PUBLIC
    loaded_at_field: CREATED_AT
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: CUSTOMER_SRC
        columns:
          - name: CUSTOMER_ID
            data_tests:
              - unique
              - not_null
  - name: sales
    database: PC_DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_SRC
  - name: product
    database: PC_DBT_DB
    schema: PUBLIC
    tables:
      - name: PRODUCT_SRC
  - name: purchase
    database: PC_DBT_DB
    schema: PUBLIC
    tables:
      - name: PURCHASE_SRC
  - name: orders
    database: PC_DBT_DB
    schema: PUBLIC
    tables:
      - name: BASE_ORDERS
  - name: patient
    database: PC_DBT_DB
    schema: PUBLIC
    tables:
      - name: PATIENT_SRC
  - name: session
    database: PC_DBT_DB
    schema: PUBLIC
    tables:
      - name: SESSION_SRC